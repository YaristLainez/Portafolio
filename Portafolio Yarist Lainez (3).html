<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Portafolio Yarist Lainez</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap">
<style>
/* Layout: portada roja con asterisco, secciones a pantalla completa alternando rojo / negro / blanco, tarjetas oscuras para el portafolio, ficha de proyecto en ventana modal */
:root{
  --red:#ff3131;
  --ink:#1b1b1b;
  --ink-soft:#2b2b2b;
  --paper:#ffffff;
  --mute:#c9c9c9;
  --on-red:#1b1b1b;
  --font-display:"Poppins","Helvetica Neue",Arial,sans-serif;
  --font-body:"Poppins","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--ink);color:var(--paper);
  font-family:var(--font-body);font-size:16px;line-height:1.6;
  -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:60}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.on-red :focus-visible,.on-paper :focus-visible{outline-color:var(--ink)}
.wrap{width:100%;max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section{padding-block:clamp(48px,8vw,104px);scroll-margin-top:56px}
.on-red{background:var(--red);color:var(--on-red)}
.on-ink{background:var(--ink);color:var(--paper)}
.on-paper{background:var(--paper);color:var(--ink)}
.rule{border:0;border-top:3px solid var(--ink);margin:0}
.on-ink .rule{border-top-color:var(--paper)}

/* tipografía */
.h-xl{margin:0;font-weight:800;font-size:clamp(2.2rem,9vw,7.2rem);line-height:.9;letter-spacing:-.035em;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
.h-red{color:var(--red)}
.label{font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.lead{font-size:clamp(1rem,1.6vw,1.2rem);font-weight:500;max-width:62ch}

/* encabezado fijo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ink);border-bottom:2px solid var(--red)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:56px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.02em;text-decoration:none;white-space:nowrap}
.brand svg{width:22px;height:22px;color:var(--red)}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 12px;border-radius:999px;font-size:.85rem;font-weight:600;text-decoration:none;white-space:nowrap;color:var(--mute);transition:background .2s,color .2s}
.nav a:hover{color:var(--paper)}
.nav a[aria-current="true"]{background:var(--red);color:var(--ink)}

/* portada */
.hero{padding-block:0}
.hero .wrap{padding-block:clamp(24px,4vw,40px)}
.contact-label{margin:0 0 14px;font-weight:800;font-size:clamp(1.6rem,3.4vw,2.4rem);letter-spacing:-.02em;text-transform:uppercase}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{display:inline-flex;align-items:center;gap:10px;min-width:0;max-width:100%;padding:8px 8px 8px 14px;border-radius:999px;background:var(--paper);color:var(--ink);font-weight:600;font-size:.95rem}
.pill svg{flex:none;width:20px;height:20px}
.pill span,.pill a{min-width:0;overflow-wrap:anywhere;text-decoration:none}
.pill a:hover{text-decoration:underline}
.copy{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);background:transparent;color:var(--ink);transition:background .15s,color .15s}
.copy:hover{background:var(--ink);color:var(--paper)}
.copy svg{width:15px;height:15px}
.stage{position:relative;display:grid;place-items:center;text-align:center;min-height:clamp(300px,50vw,560px);isolation:isolate}
.ast-hero{position:absolute;left:50%;top:50%;width:min(78vw,520px);aspect-ratio:1;margin:calc(min(78vw,520px) / -2) 0 0 calc(min(78vw,520px) / -2);color:var(--paper);z-index:-1;will-change:transform}
.ast-hero svg{width:100%;height:100%}
.name{margin:0;display:flex;flex-direction:column;align-items:center;font-weight:800;text-transform:uppercase;line-height:.84;letter-spacing:-.04em}
.name .n1{font-size:clamp(3.2rem,15vw,10.5rem)}
.name .n2{font-size:clamp(2.4rem,11vw,7.8rem)}
.tagline{margin:18px 0 0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tag{padding:6px 14px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.cta{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:14px 24px;border:0;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:600;text-decoration:none;transition:transform .15s,background .15s}
.cta:hover{transform:translateY(-2px);background:#000}
.cta.light{background:var(--paper);color:var(--ink)}
.cta.light:hover{background:var(--mute)}
.cta.red{background:var(--red);color:var(--ink)}
.cta.red:hover{background:#ff5252}
.cta svg{width:18px;height:18px}

/* perfil */
.perfil .grid{display:grid;grid-template-columns:1fr;gap:32px;align-items:start}
.perfil p{margin:0 0 1.1em;font-weight:600;max-width:64ch}
.perfil p:last-child{margin-bottom:0}
.perfil strong{color:var(--red);font-weight:800}
.photo{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:3/2;background:var(--ink-soft)}
.photo img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05)}
.photo .ast-corner{position:absolute;right:-34px;top:-34px;width:120px;height:120px;color:var(--paper)}
.photo .ast-corner svg{width:100%;height:100%}

/* FODA */
.foda-head{display:flex;flex-wrap:wrap;gap:20px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:32px}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px;padding:6px;border-radius:999px;background:var(--ink)}
.seg button{border:0;background:transparent;color:var(--paper);padding:9px 18px;border-radius:999px;font-weight:600;font-size:.9rem;transition:background .15s,color .15s}
.seg button:hover{background:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.foda-grid{display:grid;grid-template-columns:1fr;gap:16px}
.fcard{background:var(--ink);color:var(--paper);border-radius:28px;padding:22px 22px 26px;transition:opacity .25s,transform .25s}
.fcard[data-dim="true"]{opacity:.22;transform:scale(.97)}
.fcard .pillh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;padding:10px 18px;border-radius:999px;background:var(--paper);color:var(--ink)}
.fcard h3{margin:0;font-size:1rem;font-weight:800;letter-spacing:-.01em;text-transform:uppercase}
.fcard .kind{font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#5b5b5b}
.fcard ul{margin:0;padding-left:1.1rem;display:grid;gap:10px;font-size:.95rem}
.fcard li::marker{color:var(--red)}

/* segmento */
.seg-grid{display:grid;grid-template-columns:1fr;gap:28px;align-items:start}
.seg-left{position:relative}
.seg-left .ast-bg{position:absolute;right:-20px;bottom:-40px;width:min(60%,260px);color:var(--red);opacity:.95;z-index:0}
.seg-left .ast-bg svg{width:100%;height:100%;display:block}
.seg-left>*:not(.ast-bg){position:relative;z-index:1}
.brands{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.brands li{padding:10px 20px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:800;font-size:1.05rem;transition:background .15s,transform .15s}
.brands li:hover{background:var(--red);color:var(--ink);transform:rotate(-2deg)}
.dif{background:var(--ink);color:var(--paper);border-radius:28px;padding:22px}
.dif-title{display:flex;align-items:center;gap:14px;margin:0 0 14px;font-size:clamp(1.3rem,3vw,1.9rem);font-weight:800;letter-spacing:-.02em;text-transform:uppercase}
.dif-title .dot{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--red);color:var(--ink)}
.dif-title .dot svg{width:24px;height:24px}
.acc{border-top:1px solid #444}
.acc button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border:0;background:transparent;text-align:left;font-weight:800;font-size:1.05rem}
.acc button .plus{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--red);color:var(--red);transition:transform .2s,background .2s,color .2s}
.acc button[aria-expanded="true"] .plus{transform:rotate(45deg);background:var(--red);color:var(--ink)}
.acc .body{padding:0 0 18px;color:var(--mute);max-width:56ch}
.acc .body p{margin:0}

/* PUV */
.puv .grid{display:grid;grid-template-columns:1fr;gap:32px;align-items:center}
.quote{margin:28px 0 0;padding:18px 26px;border-radius:32px;background:var(--paper);color:var(--ink);font-weight:800;font-size:clamp(1.1rem,2.4vw,1.6rem);line-height:1.25;letter-spacing:-.01em;text-wrap:balance}
.puv-photo{position:relative;border-radius:28px;overflow:hidden;max-height:480px;aspect-ratio:4/3;background:var(--ink-soft)}
.puv-photo img{width:100%;height:100%;object-fit:cover;object-position:center 30%;filter:grayscale(1)}

/* portafolio */
.port-head{display:flex;flex-wrap:wrap;gap:20px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{border:2px solid var(--ink);background:transparent;color:var(--ink);padding:8px 18px;border-radius:999px;font-weight:600;font-size:.9rem;transition:background .15s,color .15s}
.chip:hover{background:rgba(27,27,27,.12)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.count{margin:0 0 24px;font-size:.9rem;font-weight:600}
.cards{display:grid;grid-template-columns:1fr;gap:16px}
.card{position:relative;display:flex;flex-direction:column;gap:12px;padding:24px;border-radius:28px;background:var(--ink);color:var(--paper);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 0 -6px rgba(0,0,0,.35)}
.card .num{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--red);color:var(--ink);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums}
.card h3{margin:0;font-size:1.3rem;font-weight:800;line-height:1.15;letter-spacing:-.02em;text-transform:uppercase;text-wrap:balance}
.card .cat{margin:0;color:var(--red);font-size:.78rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.card .ctx{margin:0;color:var(--mute);font-size:.92rem}
.card .open{margin-top:auto;display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:10px 18px;border:0;border-radius:999px;background:var(--paper);color:var(--ink);font-weight:600;font-size:.9rem}
.card .open::after{content:"";position:absolute;inset:0;border-radius:28px}
.card .open:focus-visible{outline:none}
.card:has(.open:focus-visible){outline:3px solid var(--paper);outline-offset:3px}
.card .open svg{width:16px;height:16px}

/* modal */
.overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(0,0,0,.72)}
.modal{position:relative;width:100%;max-width:860px;max-height:100%;display:flex;flex-direction:column;border-radius:28px;background:var(--ink);color:var(--paper);border:2px solid var(--red);overflow:hidden}
.m-head{display:flex;align-items:center;gap:16px;padding:20px 22px;border-bottom:1px solid #3a3a3a}
.m-head .num{flex:none;display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--red);color:var(--ink);font-weight:800;font-size:1.5rem}
.m-head h2{margin:0;font-size:clamp(1.15rem,3vw,1.7rem);font-weight:800;line-height:1.1;letter-spacing:-.02em;text-transform:uppercase;text-wrap:balance}
.m-head .cat{margin:4px 0 0;color:var(--red);font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.m-close{margin-left:auto;flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:2px solid var(--paper);background:transparent;color:var(--paper)}
.m-close:hover{background:var(--paper);color:var(--ink)}
.m-close svg{width:18px;height:18px}
.m-body{padding:22px;overflow-y:auto;display:grid;gap:22px}
.res{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:22px;background:var(--red);color:var(--ink);text-decoration:none;transition:transform .15s}
.res:hover{transform:scale(1.01)}
.res .play{flex:none;display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--paper)}
.res .play svg{width:24px;height:24px;margin-left:3px}
.res b{display:block;font-size:1.1rem;font-weight:800;line-height:1.2}
.res small{display:block;font-size:.85rem;font-weight:500}
.extra{display:flex;flex-wrap:wrap;gap:8px;margin-top:-8px}
.extra a{padding:8px 16px;border-radius:999px;border:2px solid var(--red);color:var(--paper);font-weight:600;font-size:.9rem;text-decoration:none}
.extra a:hover{background:var(--red);color:var(--ink)}
.fields{margin:0;display:grid;grid-template-columns:1fr;gap:18px 28px}
.fields div{min-width:0}
.fields dt{margin:0 0 4px;color:var(--red);font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.fields dd{margin:0;font-size:.97rem;color:#eaeaea}
.fields .full{grid-column:1/-1}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools span{padding:6px 14px;border-radius:999px;background:var(--paper);color:var(--ink);font-weight:600;font-size:.85rem}
.m-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;border-top:1px solid #3a3a3a}
.m-foot button{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:2px solid var(--paper);background:transparent;color:var(--paper);font-weight:600;font-size:.9rem}
.m-foot button:hover:not(:disabled){background:var(--paper);color:var(--ink)}
.m-foot button:disabled{opacity:.3;cursor:default}
.m-foot button svg{width:16px;height:16px}
.m-foot .pos{font-size:.85rem;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums}

/* pie */
footer{padding-block:48px}
footer .row{display:flex;flex-wrap:wrap;gap:24px 40px;align-items:center;justify-content:space-between}
footer .big{margin:0;font-weight:800;font-size:clamp(1.8rem,5vw,3rem);line-height:.95;letter-spacing:-.03em;text-transform:uppercase}
footer small{display:block;margin-top:28px;color:var(--mute)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);z-index:200;max-width:calc(100% - 32px);padding:12px 20px;border-radius:999px;background:var(--paper);color:var(--ink);font-weight:600;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:700px){
  .foda-grid{grid-template-columns:repeat(2,1fr)}
  .cards{grid-template-columns:repeat(2,1fr)}
  .fields{grid-template-columns:1fr 1fr}
}
@media (min-width:960px){
  .perfil .grid{grid-template-columns:1.05fr .95fr;gap:48px}
  .seg-grid{grid-template-columns:1fr 1fr;gap:48px}
  .puv .grid{grid-template-columns:1.1fr .9fr;gap:56px}
  .puv-photo{aspect-ratio:3/4;max-height:520px}
}
@media (min-width:1100px){
  .foda-grid{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:520px){
  .brand span{display:none}
  .pill{font-size:.88rem}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="ast" viewBox="-60 -60 120 120">
      <g fill="currentColor">
        <polygon points="-12,-46 -3,-58 3,-58 12,-46 12,46 3,58 -3,58 -12,46"/>
        <polygon points="-12,-46 -3,-58 3,-58 12,-46 12,46 3,58 -3,58 -12,46" transform="rotate(45)"/>
        <polygon points="-12,-46 -3,-58 3,-58 12,-46 12,46 3,58 -3,58 -12,46" transform="rotate(90)"/>
        <polygon points="-12,-46 -3,-58 3,-58 12,-46 12,46 3,58 -3,58 -12,46" transform="rotate(135)"/>
      </g>
    </symbol>
  </defs>
</svg>
